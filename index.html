<!doctype html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/home.css" />
    <link rel="icon" type="image/x-icon" href="assets/va.png" />
    <script src="js/mode.js"></script>
  </head>
  <body>
    <div class="semicircle-wrapper">
      <div class="semicircle"></div>
      <div class="semicircle-small"></div>
    </div>
    <div class="fullscreen" role="main">
      <div class="namediv">
        <p id="name" class="muhaqu">
          VARSHITH <span class="break"><br /></span>ANTHAGIRI
        </p>
      </div>
      <div class="buttons">
        <button
          class="main muhaqu"
          onclick="window.location.href = 'about.html'"
          aria-label="About"
        >
          <span class="buttons-text">ABOUT</span>
        </button>
        <button
          class="main muhaqu"
          onclick="window.location.href = 'projects.html'"
          aria-label="Projects"
        >
          <span class="buttons-text">PROJECTS</span>
        </button>
        <button
          class="main muhaqu"
          onclick="window.location.href = 'contact.html'"
          aria-label="Contact"
        >
          <span class="buttons-text">CONTACT</span>
        </button>
      </div>
    </div>

    <button id="mode-switch" aria-label="Mode Switcher (dark/light)">
      <img src="assets/dark.svg" id="mode-image" alt="dark or light" />
    </button>
  </body>
</html>
